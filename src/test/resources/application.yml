# ==================== SmartATS test environment configuration ====================
# Used by @WebMvcTest slice tests; loads only the minimal configuration the web layer needs

spring:
  config:
    import: optional:file:.env[.properties]
  main:
    allow-bean-definition-overriding: true

server:
  servlet:
    context-path: /api/v1

# JWT secret (fixed value for tests)
smartats:
  jwt:
    secret: TestSecretKeyForJWTMustBeLongEnoughForHS256Algorithm
    expiration: 7200
    refresh-expiration: 604800
  file:
    upload-path: ./data/test-uploads
    max-size: 10485760
  ai:
    daily-quota: 100
    embedding:
      model: embedding-3
  cors:
    allowed-origins: "*"
  verification-code:
    expire-time: 300

# Milvus configuration (test environment — the bean is replaced by a mock)
milvus:
  host: localhost
  port: 19530
  database: default
  connect-timeout: 5000
